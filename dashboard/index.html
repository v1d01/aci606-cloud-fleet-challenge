<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Flota y Telemetría - ACI606</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--accent-color);
    }

    .grid-container {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 25px;
    }

    @media (max-width: 900px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: var(--accent-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    .form-group input[type="range"],
    .form-group input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #0284c7;
      color: #fff;
    }

    .prediction-badge {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      display: none;
    }

    .status-NORMAL { background-color: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
    .status-WARNING { background-color: rgba(234, 179, 8, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .status-CRITICAL { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }

    .fleet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 15px;
    }

    .robot-card {
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      position: relative;
    }

    .robot-card-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 8px;
    }

    /* Avisos de Batería */
    .battery-warning {
      background-color: rgba(234, 179, 8, 0.25);
      color: var(--warning);
      border: 1px solid var(--warning);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
    }

    .battery-depleted {
      background-color: rgba(239, 68, 68, 0.25);
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #94a3b8;
    }

    .stat-row span:last-child {
      color: #f8fafc;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Panel de Control & Telemetría de Flota</h1>
    <div id="connection-status" style="color: var(--success);">● Servicio Conectado</div>
  </div>

  <div class="grid-container">
    
    <!-- Panel de Control Manual de Parámetros -->
    <div class="card">
      <h2>Control de Motor & Sensores</h2>
      <form id="telemetry-form">
        <div class="form-group">
          <label for="robot_id">ID del Robot</label>
          <input type="text" id="robot_id" value="R01" required>
        </div>

        <div class="form-group">
          <label for="battery">Nivel de Batería (%) <span id="bat-val">80</span></label>
          <input type="range" id="battery" min="0" max="100" step="1" value="80" oninput="updateVal('bat-val', this.value)">
        </div>

        <div class="form-group">
          <label for="motor_temp">Temperatura Motor (°C) <span id="temp-val">45.0</span></label>
          <input type="range" id="motor_temp" min="20" max="120" step="0.5" value="45.0" oninput="updateVal('temp-val', this.value)">
        </div>

        <div class="form-group">
          <label for="motor_current">Corriente del Motor (A) <span id="current-val">4.0</span></label>
          <input type="range" id="motor_current" min="0" max="15" step="0.1" value="4.0" oninput="updateVal('current-val', this.value)">
        </div>

        <div class="form-group">
          <label for="vibration">Vibración del Chasis <span id="vib-val">0.5</span></label>
          <input type="range" id="vibration" min="0" max="5" step="0.05" value="0.5" oninput="updateVal('vib-val', this.value)">
        </div>

        <div class="form-group">
          <label for="speed">Velocidad (m/s) <span id="speed-val">0.8</span></label>
          <input type="range" id="speed" min="0" max="3" step="0.05" value="0.8" oninput="updateVal('speed-val', this.value)">
        </div>

        <div class="form-group">
          <label for="obstacle_distance">Distancia Obstáculo (m) <span id="obs-val">2.0</span></label>
          <input type="range" id="obstacle_distance" min="0.05" max="10" step="0.1" value="2.0" oninput="updateVal('obs-val', this.value)">
        </div>

        <button type="button" onclick="sendInference()">Enviar Inferencia & Actualizar</button>
      </form>

      <div id="prediction-result" class="prediction-badge"></div>
    </div>

    <!-- Estado Actual de la Flota -->
    <div class="card">
      <h2>Estado de la Flota en Tiempo Real</h2>
      <div id="fleet-container" class="fleet-grid">
        <p style="color: #94a3b8;">Cargando robots...</p>
      </div>
    </div>

  </div>

  <script>
    function updateVal(id, val) {
      document.getElementById(id).innerText = val;
    }

    async function sendInference() {
      const payload = {
        robot_id: document.getElementById('robot_id').value,
        timestamp: Date.now() / 1000,
        x: 5.0,
        y: 5.0,
        speed: parseFloat(document.getElementById('speed').value),
        battery: parseFloat(document.getElementById('battery').value),
        motor_temp: parseFloat(document.getElementById('motor_temp').value),
        vibration: parseFloat(document.getElementById('vibration').value),
        motor_current: parseFloat(document.getElementById('motor_current').value),
        obstacle_distance: parseFloat(document.getElementById('obstacle_distance').value)
      };

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        
        const badge = document.getElementById('prediction-result');
        badge.style.display = 'block';
        badge.className = `prediction-badge status-${data.predicted_status}`;
        badge.innerHTML = `Estado: ${data.predicted_status} <br><small>Confianza: ${(data.confidence * 100).toFixed(1)}% | Latencia: ${data.inference_ms}ms</small>`;

        fetchFleet();
      } catch (err) {
        alert('Error al enviar inferencia: ' + err);
      }
    }

    async function fetchFleet() {
      try {
        const response = await fetch('/robots');
        const robots = await response.json();

        const container = document.getElementById('fleet-container');
        if (robots.length === 0) {
          container.innerHTML = '<p style="color: #94a3b8;">No hay robots registrados en la base de datos.</p>';
          return;
        }

        container.innerHTML = robots.map(r => {
          let batClass = 'color: var(--success);';
          let alertHtml = '';

          if (r.battery === 0) {
            batClass = 'color: var(--danger); font-weight: bold;';
            alertHtml = '<div class="battery-depleted">🚨 BATERÍA AGOTADA (0%)</div>';
          } else if (r.battery <= 20) {
            batClass = 'color: var(--warning); font-weight: bold;';
            alertHtml = `<div class="battery-warning">⚠️ BATERÍA BAJA (${r.battery}%)</div>`;
          }

          return `
            <div class="robot-card">
              <div class="robot-card-header">
                <span>Robot ${r.robot_id}</span>
                <span style="${batClass}">${r.battery}% Batería</span>
              </div>
              ${alertHtml}
              <div class="stat-row"><span>Temp. Motor:</span> <span>${r.motor_temp} °C</span></div>
              <div class="stat-row"><span>Corriente:</span> <span>${r.motor_current} A</span></div>
              <div class="stat-row"><span>Vibración:</span> <span>${r.vibration}</span></div>
              <div class="stat-row"><span>Velocidad:</span> <span>${r.speed} m/s</span></div>
              <div class="stat-row"><span>Obstáculo:</span> <span>${r.obstacle_distance} m</span></div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Error al actualizar flota:', err);
      }
    }

    fetchFleet();
    setInterval(fetchFleet, 3000);
  </script>
</body>
</html>
